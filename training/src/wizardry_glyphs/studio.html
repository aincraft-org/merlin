<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Glyph studio</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; background: #0b1220; color: #e5e7eb; }
    header { padding: 16px 20px; border-bottom: 1px solid #1f2937; display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; font-size: 18px; font-weight: 600; }
    header p { margin: 0; color: #94a3b8; font-size: 13px; }
    main { display: grid; grid-template-columns: 560px 280px 1fr; gap: 20px; padding: 20px; }
    canvas#board { background: #030712; border: 1px solid #334155; cursor: crosshair; image-rendering: pixelated; }
    .panel { background: #111827; border: 1px solid #1f2937; border-radius: 10px; padding: 14px; }
    .panel h2 { margin: 0 0 10px; font-size: 14px; color: #93c5fd; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    button { background: #1e293b; color: #e5e7eb; border: 1px solid #334155; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
    button:hover { background: #334155; }
    .guess { font-size: 28px; font-weight: 700; margin: 4px 0 2px; }
    .score { color: #38bdf8; }
    .bar { height: 8px; background: #0f172a; border-radius: 99px; overflow: hidden; margin: 4px 0 10px; }
    .bar > span { display: block; height: 100%; background: #38bdf8; }
    .cand { display: flex; justify-content: space-between; font-size: 13px; margin: 4px 0; }
    canvas#seen { width: 192px; height: 192px; background: #030712; border: 1px solid #334155; image-rendering: pixelated; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; max-height: calc(100vh - 120px); overflow: auto; }
    .glyph { background: #0b1220; border: 1px solid #1f2937; border-radius: 8px; padding: 6px; text-align: center; }
    .glyph canvas { width: 72px; height: 72px; image-rendering: pixelated; background: #030712; }
    .glyph div { font-size: 11px; margin-top: 4px; color: #cbd5e1; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Glyph studio</h1>
      <p>Draw on the 128×128 map. Placement does not matter. Incomplete marks and the wrong stroke count stay unlabeled.</p>
    </div>
    <p id="status">loading catalog…</p>
  </header>
  <main>
    <section>
      <canvas id="board" width="512" height="512"></canvas>
      <div class="row">
        <button id="classify">Classify</button>
        <button id="undo">Undo</button>
        <button id="clear">Clear</button>
        <label>brush <input id="brush" type="range" min="2" max="12" value="6" /></label>
      </div>
      <div class="row" id="inks">
        <button type="button" data-ink="physical">bone</button>
        <button type="button" data-ink="fire">ember</button>
        <button type="button" data-ink="frost">glacier</button>
        <button type="button" data-ink="arcane">violet</button>
      </div>
    </section>
    <section class="panel">
      <h2>Model view</h2>
      <div class="guess" id="label">—</div>
      <div class="score" id="score"></div>
      <p id="order" style="color:#94a3b8;font-size:13px">Stroke count and order are part of the glyph. A dash is not a crosshair.</p>
      <div class="bar"><span id="bar" style="width:0"></span></div>
      <div id="cands"></div>
      <p>What the model sees (64×64 crop)</p>
      <canvas id="seen" width="64" height="64"></canvas>
    </section>
    <section>
      <h2 style="margin:0 0 10px;font-size:14px;color:#93c5fd">Catalog</h2>
      <div class="grid" id="catalog"></div>
    </section>
  </main>
  <script>
    const SCALE = 4, SIZE = 128;
    const INKS = { physical: "#E8E4D9", fire: "#FF4D00", frost: "#3DDCFF", arcane: "#B44AFF" };
    const board = document.getElementById("board");
    const seen = document.getElementById("seen");
    const bctx = board.getContext("2d");
    let strokes = [], current = null, drawing = false, ink = "physical";

    function inkColor(name) { return INKS[name] || INKS.physical; }

    function setInk(name) {
      ink = INKS[name] ? name : "physical";
      for (const button of document.querySelectorAll("#inks [data-ink]")) {
        button.style.outline = button.dataset.ink === ink ? "2px solid " + inkColor(ink) : "none";
      }
    }

    function redraw() {
      bctx.fillStyle = "#030712";
      bctx.fillRect(0, 0, board.width, board.height);
      bctx.lineCap = "round";
      bctx.lineJoin = "round";
      for (const stroke of strokes) {
        const color = inkColor(stroke.element);
        bctx.strokeStyle = color;
        bctx.fillStyle = color;
        bctx.lineWidth = (stroke.brush_width || 6) * SCALE;
        bctx.beginPath();
        stroke.points.forEach((p, i) => i ? bctx.lineTo(p.x * SCALE, p.y * SCALE) : bctx.moveTo(p.x * SCALE, p.y * SCALE));
        if (stroke.points.length === 1) {
          bctx.arc(stroke.points[0].x * SCALE, stroke.points[0].y * SCALE, (stroke.brush_width || 6) * SCALE / 2, 0, Math.PI * 2);
          bctx.fill();
        } else bctx.stroke();
      }
    }

    function pt(event) {
      const box = board.getBoundingClientRect();
      const x = (event.clientX - box.left) * (board.width / box.width) / SCALE;
      const y = (event.clientY - box.top) * (board.height / box.height) / SCALE;
      return { x: Math.min(127.5, Math.max(0.5, x)), y: Math.min(127.5, Math.max(0.5, y)) };
    }

    board.addEventListener("pointerdown", event => {
      board.setPointerCapture(event.pointerId);
      drawing = true;
      current = { points: [pt(event)], brush_width: Number(document.getElementById("brush").value), element: ink };
      strokes.push(current);
      redraw();
    });
    board.addEventListener("pointermove", event => {
      if (!drawing || !current) return;
      current.points.push(pt(event));
      redraw();
    });
    const stop = () => { drawing = false; current = null; };
    board.addEventListener("pointerup", stop);
    board.addEventListener("pointercancel", stop);

    function drawRaster(canvas, raster) {
      const ctx = canvas.getContext("2d");
      const img = ctx.createImageData(64, 64);
      const rgb = Array.isArray(raster) && raster.length === 3 && Array.isArray(raster[0]) && Array.isArray(raster[0][0]);
      for (let i = 0; i < 64 * 64; i++) {
        const y = Math.floor(i / 64), x = i % 64;
        if (rgb) {
          img.data[i * 4] = Math.round((raster[0][y][x] || 0) * 255);
          img.data[i * 4 + 1] = Math.round((raster[1][y][x] || 0) * 255);
          img.data[i * 4 + 2] = Math.round((raster[2][y][x] || 0) * 255);
        } else {
          const v = Math.round((raster[y][x] || 0) * 255);
          img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v;
        }
        img.data[i * 4 + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);
    }

    async function classify() {
      if (!strokes.length) return;
      document.getElementById("status").textContent = "classifying…";
      const response = await fetch("/api/classify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ strokes }),
      });
      const data = await response.json();
      if (!response.ok) {
        document.getElementById("status").textContent = data.error || "classify failed";
        return;
      }
      if (data.accepted) {
        document.getElementById("label").textContent = data.label;
        document.getElementById("score").textContent = (data.score * 100).toFixed(1) + "%";
      } else {
        document.getElementById("label").textContent = "not a glyph";
        document.getElementById("score").textContent = (data.reason || "rejected") + (data.suggestion ? ` · looks a bit like ${data.suggestion}` : "");
      }
      document.getElementById("bar").style.width = data.accepted ? (data.score * 100).toFixed(1) + "%" : "0%";
      document.getElementById("order").textContent = `${data.stroke_count} stroke${data.stroke_count===1?"":"s"} in draw order`;
      document.getElementById("cands").innerHTML = data.candidates.slice(0, 8).map(item =>
        `<div class="cand"><span>${item.label}</span><span>${(item.score * 100).toFixed(1)}%</span></div>`
      ).join("");
      drawRaster(seen, data.raster);
      document.getElementById("status").textContent = "ready";
    }

    document.getElementById("classify").onclick = classify;
    document.getElementById("clear").onclick = () => { strokes = []; redraw(); };
    document.getElementById("undo").onclick = () => { strokes.pop(); redraw(); };
    document.getElementById("inks").onclick = event => {
      const name = event.target && event.target.dataset && event.target.dataset.ink;
      if (name) setInk(name);
    };
    setInk("physical");

    fetch("/api/catalog").then(r => r.json()).then(data => {
      const root = document.getElementById("catalog");
      for (const glyph of data.glyphs) {
        const cell = document.createElement("div");
        cell.className = "glyph";
        const c = document.createElement("canvas");
        c.width = 64; c.height = 64;
        drawRaster(c, glyph.raster);
        const name = document.createElement("div");
        name.textContent = glyph.label;
        cell.append(c, name);
        root.append(cell);
      }
      document.getElementById("status").textContent = "ready — draw a sigil, then Classify";
    });
    redraw();
  </script>
</body>
</html>
